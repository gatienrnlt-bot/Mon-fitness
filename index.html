<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Fitness">
<meta name="theme-color" content="#06080C">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mon Fitness</title>
<style>
/* Layout : app mobile plein écran façon iOS, en-tête avec logo, contenu qui défile, 4 onglets fixes en bas, mode séance en surcouche */
:root{
  --bg:#06080C; --s1:#0F131A; --s2:#161B24; --s3:#212836; --line:#232B3A;
  --fg:#F4F7FB; --mut:#9AA4B5; --dim:#647086;
  --acc:#1E90FF; --acc2:#5CC0FF; --acc-ink:#FFFFFF; --acc-soft:rgba(30,144,255,.15);
  --grad:linear-gradient(180deg,#36A6FF 0%,#0B72F0 100%);
  --ok:#2FD88A; --ok-soft:rgba(47,216,138,.14); --warn:#F5B544; --warn-soft:rgba(245,181,68,.15);
  --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.14); --gray-soft:rgba(154,164,181,.14);
  --c-prot:#1E90FF; --c-carb:#9B7BFF; --c-fat:#F5C542;
  --f-disp:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:18px; --r-s:12px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-weight:900;font-style:italic;font-size:20px;letter-spacing:.01em}
.brand svg{width:30px;height:30px;flex:none}
.brand b{background:linear-gradient(180deg,#5CC0FF,#1E7BFF);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.gear{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.gear svg{width:24px;height:24px}
.top-r{display:flex;align-items:center;gap:8px}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:var(--s1);border:1px solid var(--line)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:block}
.sync.ok i{background:var(--ok)} .sync.loc i{background:var(--warn)} .sync.err i{background:var(--bad)} .sync.ing i{background:var(--acc2)}

main{display:flex;flex-direction:column;gap:14px;padding-top:4px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
.lbl{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--mut)} .small{font-size:14px} .tiny{font-size:12px}
p{margin:0}
b{font-weight:700}

.card{background:linear-gradient(180deg,#121722 0%,var(--s1) 100%);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;width:100%}
.card.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(30,144,255,.28) 0%,rgba(30,144,255,0) 60%),linear-gradient(180deg,#121a28,var(--s1));border-color:#1d3a63}
button.card{color:inherit}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}

.btn{min-height:52px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);border:1px solid var(--line);color:var(--fg);text-align:center}
.btn.pri{background:var(--grad);border-color:#2A8CFF;color:var(--acc-ink);box-shadow:0 6px 20px rgba(30,144,255,.28)}
.btn.big{min-height:58px;font-family:var(--f-disp);font-size:18px;font-weight:700;width:100%;padding:0 12px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052417}
.btn.danger{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;font-size:14px;padding:0 12px;border-radius:11px}
.btn.full{width:100%}
.btn:disabled{opacity:.4}

.bar{height:9px;border-radius:99px;background:var(--s3);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.6}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--s3);color:var(--mut);white-space:nowrap}
.pill.acc{background:var(--acc-soft);color:var(--acc2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gray{background:var(--gray-soft);color:var(--mut)}

.note{border-radius:var(--r-s);padding:12px 14px;font-size:14px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}
.note.warn{background:var(--warn-soft);border-color:rgba(245,181,68,.35);color:#FBE0AE}
.note.bad{background:var(--bad-soft);border-color:rgba(255,107,107,.4);color:#FFCACA}
.note.acc{background:var(--acc-soft);border-color:rgba(30,144,255,.4);color:#CFE6FF}
.note.ok{background:var(--ok-soft);border-color:rgba(61,214,140,.35);color:#C5F3DC}
.note b{color:var(--fg)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px;background:var(--s2);font-size:13px;color:var(--mut)}
.wd.today{outline:2px solid var(--acc)}
.wd .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:14px;border:1.5px dashed var(--line);color:var(--dim)}
.wd .dot.plan{border:1.5px solid var(--acc);color:var(--acc2)}
.wd .dot.done{background:var(--ok);border-color:var(--ok);color:#052417}

.stat{display:flex;flex-direction:column;gap:3px}
.stat .v{font-family:var(--f-disp);font-weight:800;font-size:28px;line-height:1;letter-spacing:-.01em}
.stat .v small{font-size:16px;font-weight:600;color:var(--mut);margin-left:3px}
.up{color:var(--ok)} .down{color:var(--acc2)}

.wk-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk{background:var(--s2);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:104px;color:inherit}
.wk .tag{font-family:var(--f-disp);font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--acc2)}
.wk .nm{font-family:var(--f-disp);font-weight:700;font-size:17px;line-height:1.1}
.wk.done{border-color:rgba(61,214,140,.5)}

.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center;flex:none;background:var(--s2)}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:18px;height:18px;opacity:0}
.check.on svg{opacity:1}
.toggle-row{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;padding:4px 0;color:inherit}

.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:12px;align-items:flex-start}
.thumb{width:92px;flex:none;background:var(--s2);border-radius:12px;padding:4px;position:relative;overflow:hidden;aspect-ratio:160/110;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.thumb .zoom{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.55);display:grid;place-items:center}
.thumb .zoom svg{width:12px;height:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ill{display:block;width:100%;height:auto}
.ill .b{fill:none;stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ill .m{fill:none;stroke:var(--dim);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ill .d{fill:none;stroke:var(--acc2);stroke-width:2.5;stroke-dasharray:5 4;opacity:.8}
.ill .hd{fill:var(--fg)}
.ill .a{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.ill .ah{fill:var(--acc)}
.big-ill{display:block;width:100%;background:var(--s2);border-radius:14px;padding:10px;position:relative}
.big-ill img{width:100%;border-radius:10px;display:block}

.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut);text-align:center}
.seg button.on{background:var(--s3);color:var(--fg)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;color:var(--mut);font-weight:600}
.inp{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:0 14px;font-size:18px;font-weight:600}
.inp:focus{border-color:var(--acc);outline:none}
.inp.t{font-size:16px;font-weight:500}
select.inp{font-size:16px}
textarea.inp{min-height:96px;padding:12px 14px;font-size:16px;font-weight:500;resize:vertical}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:50px;height:50px;border-radius:12px;background:var(--s3);font-size:24px;font-weight:600;text-align:center}
.stepper .v{flex:1;text-align:center;font-family:var(--f-disp);font-weight:700;font-size:24px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,11,16,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));display:flex;justify-content:center}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;font-size:11px;font-weight:600;color:var(--dim);border-radius:12px;text-align:center}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--acc)}

#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sheet{position:relative;width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--s1);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);border-bottom:0;padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.choice{display:grid;gap:10px}
.choice button{min-height:56px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:17px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:inherit}
.choice button.on{border-color:var(--acc);background:var(--acc-soft)}
.choice small{font-weight:500;color:var(--mut);font-size:13px}
ul.l,ol.l{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

#lightbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lightbox .frame{width:100%;max-width:900px;max-height:80vh;display:grid;place-items:center;background:var(--s1);border-radius:16px;padding:10px;overflow:auto}
#lightbox img{max-width:100%;max-height:76vh;border-radius:10px}
#lightbox .ill{max-height:70vh}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:95;background:var(--s3);border:1px solid var(--line);color:var(--fg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.45)}

/* LIVE */
#live{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lv-top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;border-bottom:1px solid var(--line)}
.lv-in{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.lv-body{flex:1;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;-webkit-overflow-scrolling:touch}
.lv-body>.lv-in{gap:14px}
.lv-foot{border-top:1px solid var(--line);background:var(--s1);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lv-title{font-family:var(--f-disp);font-weight:800;font-size:26px;line-height:1.08}
.set-hd,.setrow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 46px 46px;gap:7px;align-items:center}
.set-hd{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:0 6px;text-align:center}
.setrow{padding:6px;border-radius:14px}
.setrow.cur{background:var(--acc-soft);outline:1.5px solid rgba(30,144,255,.55)}
.setrow .n{font-family:var(--f-disp);font-weight:800;font-size:22px;text-align:center;color:var(--mut)}
.setrow.cur .n{color:var(--acc2)}
.setrow .inp{min-height:50px;text-align:center;padding:0 4px;font-size:20px}
.setrow .check{width:46px;height:46px;border-radius:12px}
.vbtn{width:46px;height:46px;border-radius:12px;background:var(--grad);color:var(--acc-ink);font-weight:800;font-size:12px;display:grid;place-items:center;text-align:center;line-height:1.05}
.vbtn:disabled{background:var(--s3);color:var(--dim)}
.timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer .t{font-family:var(--f-disp);font-weight:800;font-size:42px;line-height:1;min-width:104px}
.timer.done{background:var(--ok-soft);border-radius:14px;padding:6px 10px}
.timer.done .t{color:var(--ok)}
.timer .tb{display:flex;gap:6px;margin-left:auto}
.timer .tb button{min-width:46px;height:46px;padding:0 8px;border-radius:12px;background:var(--s3);font-weight:700;font-size:13px;display:grid;place-items:center;text-align:center}
.timer .tb button svg{width:22px;height:22px}
.lv-nav{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.lv-nav .btn{padding:0}

.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--acc2);stroke-width:1.5;stroke-dasharray:4 4}
.chart .ax{fill:var(--mut);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--acc);opacity:.14}
.chart .pt{fill:var(--bg);stroke:var(--acc);stroke-width:2}
.chart .pt.last{fill:var(--acc);stroke:var(--acc)}
.chart .cbar{fill:var(--acc)}
.chart .cbar.low{fill:var(--dim)}
.chart .vl{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--f-body)}

.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--s2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;width:100%;color:inherit}
.li table{width:100%;border-collapse:collapse;font-size:14px}
.li td{padding:4px 0;vertical-align:top}
.li td:last-child{text-align:right;color:var(--mut);padding-left:10px}
.food{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--s2);width:100%;color:inherit}
.food .fn{flex:1;min-width:0}
.food .fv{font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.empty{text-align:center;padding:24px 10px;color:var(--mut);display:flex;flex-direction:column;gap:8px;align-items:center}
.drops{display:flex;gap:5px;flex-wrap:wrap}
.drops i{width:20px;height:28px;border-radius:5px 5px 8px 8px;border:2px solid var(--line);display:block}
.drops i.on{background:var(--acc);border-color:var(--acc)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:96px;color:inherit}
.tile svg{width:26px;height:26px;color:var(--acc)}
.tile b{font-family:var(--f-disp);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:inherit}
.chip.on{background:var(--ok-soft);border-color:rgba(61,214,140,.5);color:var(--ok)}
.meal-ph{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block}
.eqst{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.score button{min-height:52px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-family:var(--f-disp);font-weight:800;font-size:20px;text-align:center;color:var(--fg)}
.score button.mid{color:var(--warn)} .score button.hi{color:var(--bad)}
.score button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chart .ln2{fill:none;stroke:var(--warn);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:6 4}
.chart .pt2{fill:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* écrans façon maquette */
.hello h1{font-size:28px}
.hello p{color:var(--mut);font-size:16px}
.goal{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{fill:none;stroke:var(--s3);stroke-width:9}
.ring .fgc{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800}
.today-card{display:flex;align-items:center;gap:12px;width:100%;color:inherit}
.today-card .ic{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;color:var(--acc2);flex:none}
.today-card .ic svg{width:22px;height:22px}
.chev{width:22px;height:22px;color:var(--mut);flex:none}
.daytiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dt{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:inherit;min-width:0}
.dt svg{width:24px;height:24px;color:var(--fg)}
.dt b{font-size:17px;font-weight:800;white-space:nowrap}
.dt span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dt.on span{color:var(--ok)}
.sess-hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(90% 120% at 80% 10%,rgba(30,144,255,.35),rgba(30,144,255,0) 60%),linear-gradient(160deg,#0f1622,#05070a);min-height:150px;display:flex;align-items:flex-end;padding:14px}
.sess-hero .ill{position:absolute;right:-6px;top:4px;width:62%;opacity:.9}
.sess-hero .ill .b{stroke-width:3.2}
.sess-hero .txt{position:relative;display:flex;flex-direction:column;gap:6px;max-width:58%}
.xrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:16px;background:var(--s1);border:1px solid var(--line);color:inherit;text-align:left}
.xrow .th{width:76px;flex:none;background:var(--s2);border-radius:10px;padding:3px;aspect-ratio:160/110}
.xrow .th img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.xrow .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.xrow .tx b{font-size:16px;line-height:1.2}
.xrow .tx span{font-size:13px;color:var(--mut)}
.circ{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.circ.on{background:var(--acc);border-color:var(--acc)}
.circ svg{width:15px;height:15px}
.sticky-cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:4;padding-top:6px}
.gauge{position:relative;width:min(260px,100%);margin:0 auto}
.gauge svg{width:100%;height:auto;display:block}
.gauge .gt{position:absolute;left:0;right:0;bottom:6px;text-align:center;display:flex;flex-direction:column;align-items:center}
.gauge .gt b{font-size:30px;font-weight:800;line-height:1}
.gauge .gt b small{font-size:16px;color:var(--mut);font-weight:600}
.macro{display:grid;grid-template-columns:24px 1fr auto;gap:4px 10px;align-items:center}
.macro .bar{grid-column:2 / 4;height:7px}
.macro svg{width:20px;height:20px;color:var(--mut)}
.checklist{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.checklist button{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;width:100%;color:inherit;text-align:left;border-bottom:1px solid var(--line)}
.checklist button:last-child{border-bottom:0}
.checklist button span{flex:1}
.checklist button span.circ{flex:none}
.brand>span:last-child{white-space:nowrap}
.sync span{white-space:nowrap}
@media (max-width:420px){.sync span{display:none}.sync{padding:8px}}
.checklist svg.ico{width:20px;height:20px;color:var(--mut)}
.howto h3{display:flex;align-items:center;gap:8px;font-size:16px}
.howto h3 i{width:24px;height:24px;border-radius:8px;background:var(--acc-soft);color:var(--acc2);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;flex:none}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
ol.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:st}
ol.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:14px;display:grid;place-items:center}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{min-height:48px;border-radius:12px;background:var(--s2);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 8px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;min-height:40px;padding:0 16px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mut)}
.pills button.on{background:var(--grad);border-color:#2A8CFF;color:#fff}
.phpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phpair img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:370px){h1{font-size:30px}.stat .v{font-size:28px}.wk-list,.tiles{grid-template-columns:1fr}.thumb{width:76px}}
</style>
</head>

function migrateProgram(s){
  if((s.progV||1)>=2) return s;
  const nc={};
  Object.entries(s.choice||{}).forEach(([key,val])=>{const [w,i]=key.split(":");const ob=OLD_PROG[w]?.[+i];if(!ob)return;const nb=OLD_REPLACED[ob]||ob;

  if(s.live) s.live.items.forEach((it,i)=>{if(!it.base)it.base=OLD_PROG[s.live.wid]?.[i]||it.ex;});
  s.progV=2; s.progNews=true; return s;
}

async function flushCloud(){
  if(!cloud||cBusy||!cDirty)return;
  cBusy=true;cDirty=false;
  try{
    await cloud.ref.set(clone(S));
    for(const id of [...pendS]){const s=SESSIONS.find(x=>x.id===id); if(s) await cloud.sess.doc(id).set(clone(s)); pendS.delete(id);}
    for(const k of [...pendD]){ if(DAYS[k]) await cloud.days.doc(k).set(clone(DAYS[k])); pendD.delete(k);}

const UNITS=[[/^cuilleres? a soupe|^c\.? ?a\.? ?s\.?\b|^cas\b/,"cs"],[/^cuilleres? a cafe|^c\.? ?a\.? ?c\.?\b|^cac\b/,"cc"],[/^cuilleres?\b/,"cuillere"],[/^pots?\b/,"pot"],[/^tranches?\b/,"tranche"],[/^verres?\b/,"verre"],[/^bols?\b/,"bol"],[/^poignees?\b/,"poignee"],[/^boites?\b/,"boite"],[/^parts?\b/,"part"],[/^(doses?|scoops?|shakers?|mesures?)\b/,"dose"],[/^canettes?\b/,"canette"],[/^carres?\b/,"carre"],[/^boules?\b/,"boule"],[/^morceaux?\b/,"morceau"],[/^paquets?\b/,"paquet"],[/^tasses?\b/,"tasse"],[/^portions?\b/,"portion"],[/^assiettes?\b/,"assiette"],[/^barres?\b/,"piece"]];

function parseMealText(raw){
  let t=norm(raw).replace(/j'ai (mange|pris|bu)|j ai (mange|pris|bu)|^ce (matin|midi|soir)|^aujourd'hui/g," ");
  const parts=t.split(/,|;|\+|\n|\bet\b|\bavec\b|\bpuis\b|\bainsi que\b|\bplus\b/).map(s=>s.trim()).filter(s=>s&&!/^(de|du|des|un peu|rien|c'est tout)$/.test(s));

function parseChunk(p){

  if(m1){const v=parseFloat(m1[1].replace(",","."));const u=m1[2];g=u.startsWith("k")?v*1000:u==="cl"?v*10:(u==="l"||u.startsWith("litre"))?v*1000:v;}
  else{
    const m2=p.match(/^(\d+(?:[.,]\d+)?|un|une|deux|trois|quatre|cinq|six|sept|huit|dix|demi|demie|1\/2)\s+(.*)$/);
    if(m2){
      const n=m2[1]==="1/2"?0.5:(NUMW[m2[1]]??parseFloat(m2[1].replace(",",".")));
      let rest=m2[2].replace(/^(de |d'|d )/,""); let unit="piece";
      for(const [re,k] of UNITS){ if(re.test(rest)){unit=k;break;} }
      if(food){
        if(food.u&&food.u[unit]) g=n*food.u[unit];

      }

function lineChart(pts,unit){
  const W=340,H=170,pl=38,pr=14,pt=18,pb=26,vals=pts.map(p=>p.v);let lo=Math.min(...vals),hi=Math.max(...vals);if(hi===lo){hi+=1;lo-=1;}const pv=(hi-lo)*.15;lo-=pv;hi+=pv;
  const X=i=>pl+(pts.length===1?0:i*(W-pl-pr)/(pts.length-1)),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const ticks=[lo+(hi-lo)*.1,(lo+hi)/2,hi-(hi-lo)*.1],line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" "),step=Math.ceil(pts.length/5);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Graphique de progression">
    ${ticks.map(t=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${pl-6}" y="${Y(t)+4}" text-anchor="end">${fr(t)}</text>`).join("")}
    <polygon class="ar" points="${X(0)},${H-pb} ${line} ${X(pts.length-1)},${H-pb}"/><polyline class="ln" points="${line}"/>
    ${pts.map((p,i)=>`<circle class="pt ${i===pts.length-1?"last":""}" cx="${X(i)}" cy="${Y(p.v)}" r="${i===pts.length-1?5:3.5}"/>`).join("")}
    <text class="vl" x="${Math.min(X(pts.length-1),W-pr-2)}" y="${Y(pts[pts.length-1].v)-10}" text-anchor="end">${fr(pts[pts.length-1].v)}${unit}</text>
    ${pts.map((p,i)=>(i%step===0||i===pts.length-1)?`<text class="ax" x="${X(i)}" y="${H-8}" text-anchor="middle">${p.l}</text>`:"").join("")}</svg>`;
}
function barChart(bars,ref,label,fmt){
  fmt=fmt||(v=>v);const W=340,H=150,pl=30,pr=8,pt=16,pb=24,max=Math.max(ref||0,...bars.map(b=>b.v),1);
  const bw=(W-pl-pr)/bars.length,Y=v=>pt+(max-v)*(H-pt-pb)/max;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}"/>
    ${ref?`<line class="ref" x1="${pl}" x2="${W-pr}" y1="${Y(ref)}" y2="${Y(ref)}"/><text class="ax" x="${pl-4}" y="${Y(ref)+4}" text-anchor="end">${fmt(ref)}</text>`:""}
    ${bars.map((b,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,y=Y(Math.max(b.v,max*.02));return `<rect class="cbar ${ref&&b.v<ref?"low":""}" x="${x}" y="${y}" width="${w}" height="${H-pb-y}" rx="4"/>${b.v?`<text class="vl" x="${x+w/2}" y="${y-4}" text-anchor="middle">${fmt(b.v)}</text>`:""}<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${b.l}</text>`;}).join("")}</svg>`;
}

function evalCard(k){

  L.push(t.fv?["ok","Fruits ou légumes présents."]:["acc","Pas encore de fruits ou légumes notés : une portion au prochain repas ?"]);
  L.push(w>=S.waterRef?["ok",`Hydratation : ${fr(w/1000,2)} L, repère atteint.`]:["acc",`Hydratation : ${fr(w/1000,2)} L sur un repère de ${fr(S.waterRef/1000,2)} L.`]);

}

async function compress(file){
  return new Promise((res)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const max=1400,r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>res(b||file),"image/jpeg",.82);};img.onerror=()=>{URL.revokeObjectURL(url);res(file);};img.src=url;});
}
async function onPhoto(file){

}

function buildCSV(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,L=[];
  L.push("SEANCES");L.push(["date","seance","exercice","serie","charge_kg","repetitions","note","douleur"].join(";"));
  SESSIONS.forEach(s=>s.exercises.forEach(e=>e.sets.forEach((x,k)=>L.push([s.date.slice(0,10),q(s.name),q(EX[e.ex]?.n||e.name),k+1,x.w==null?"":String(x.w).replace(".",","),x.r,q(e.note),q(e.pain)].join(";")))));
  L.push("");L.push("GENOUX");L.push("date;seance;douleur_avant_0_10;douleur_apres_0_10");
  SESSIONS.forEach(s=>{if(s.kneeBefore!=null||s.kneeAfter!=null)L.push([s.date.slice(0,10),q(s.name),s.kneeBefore??"",s.kneeAfter??""].join(";"));});
  L.push("");L.push("REPAS");L.push(["date","repas","aliment","grammes","kcal","proteines_g","glucides_g","lipides_g","source","repas_enregistre"].join(";"));
  Object.keys(DAYS).sort().forEach(k=>MEALS.forEach(m=>{const meal=DAYS[k].meals?.[m.k];if(!meal)return;meal.items.forEach(i=>L.push([k,m.n,q(i.name),i.g,Math.round(i.kcal),fr(i.p),fr(i.c),fr(i.f),q(i.src),meal.rec?1:0].join(";")));}));
  L.push("");L.push("QUOTIDIEN");L.push(["date","eau_ml","creatine","dose_g","heure","sommeil_h","note"].join(";"));
  Object.keys(DAYS).sort().forEach(k=>{const d=DAYS[k];L.push([k,waterTotal(k),d.crea?.taken?1:0,d.crea?.taken?d.crea.dose:"",d.crea?.time||"",d.sleep!=null?String(d.sleep).replace(".",","):"",q(d.note)].join(";"));});
  L.push("");L.push("MENSURATIONS");L.push("date;bras_cm;poitrine_cm;taille_cm;cuisse_cm");
  [...S.measures].sort((a,b)=>a.date<b.date?-1:1).forEach(m=>L.push([m.date,...MFIELDS.map(([k])=>m[k]!=null?String(m[k]).replace(".",","):"")].join(";")));
  L.push("");L.push("POIDS");L.push("date;kg");S.bodyweight.forEach(b=>L.push(b.date+";"+String(b.kg).replace(".",",")));

  return L.join("\n");
}

  waterCustom:d=>{const v=num($("#wCustom").value);if(!v||v<=0||v>3000){toast("Indique une quantité entre 1 et 3000 ml");return;}addWater(d.k,Math.round(v));render();},
  waterUndo:d=>{day(d.k).water.pop();persist(d.k);render();},
  wday:d=>{ui.wdate=shiftDay(ui.wdate,+d.d);render();},
  wRef:d=>{S.waterRef=Math.min(5000,Math.max(500,S.waterRef+ +d.d));persist();render();},
  /* équipements */
  eqSet:d=>{S.equip[d.id]=S.equip[d.id]===d.v?undefined:d.v;if(!S.equip[d.id])delete S.equip[d.id];persist();render();if(d.v==="absent"&&S.equip[d.id])toast("Exercices concernés : alternative appliquée");},
  eqF:d=>{ui.eqFilter=d.s;render();},
  /* données */
  export:d=>doExport(d.f),
  copyExport:()=>{const t=$("#exportTxt");const p=navigator.clipboard?.writeText(t.value);if(p)p.then(()=>toast("Copié"),()=>{t.select();toast("Sélectionné : copie manuellement");});else t.select();},
  resetAsk:()=>{$("#resetBox").innerHTML=`<div class="note bad stack"><b>Tout supprimer ?</b><span>Séances, repas, créatine, eau, équipements et poids seront effacés${cloud?" de ton compte et de cet appareil":""}. Exporte d'abord si tu veux une copie.</span><div class="grid2"><button class="btn" data-a="resetCancel">Annuler</button><button class="btn danger" data-a="resetDo">Supprimer</button></div></div>`;},
  resetCancel:()=>{$("#resetBox").innerHTML="";},
  resetDo:()=>resetAll()
};
const INP={
  lw:t=>{const s=S.live.items[S.live.idx].sets[+t.dataset.k];const v=num(t.value);s.w=v==null?"":v;soft();},
  lr:t=>{const s=S.live.items[S.live.idx].sets[+t.dataset.k];const v=num(t.value);s.r=v==null?"":v;soft();},
  lnote:t=>{S.live.items[S.live.idx].note=t.value;soft();},
  lpain:t=>{S.live.items[S.live.idx].pain=t.value;soft();},
  endNote:t=>{if(S.live){S.live.endNote=t.value;soft();}},
  snote:t=>{const s=SESSIONS.find(x=>x.id===t.dataset.id);if(s){s.note=t.value;pendS.add(s.id);soft();}},
  dnote:t=>{day(t.dataset.k).note=t.value;soft(t.dataset.k);},
  mnote:t=>{day(t.dataset.k).meals[t.dataset.m].note=t.value;soft(t.dataset.k);},
  addTxt:t=>{ADD.text=t.value;},
  libQ:t=>{ui.libQ=t.value;clearTimeout(INP._l);INP._l=setTimeout(()=>{const pos=t.selectionStart;render();const n=$("#libQ");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},350);},
  creaT:t=>{const c=day(t.dataset.k).crea;if(c){c.time=t.value;soft(t.dataset.k);}},
  day:t=>{S.schedule[t.dataset.w]=+t.value;persist();},
  exSel:t=>{ui.exSel=t.value;render();},
  import:t=>{const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="mon-fitness"||!o.state)throw 0;
    const ids=new Set(SESSIONS.map(s=>s.id));(o.sessions||[]).forEach(s=>{if(!ids.has(s.id)){SESSIONS.push(s);pendS.add(s.id);}});SESSIONS.sort((a,b)=>a.date<b.date?-1:1);
    Object.entries(o.days||{}).forEach(([k,v])=>{if(!DAYS[k]||(v.u||0)>(DAYS[k].u||0)){DAYS[k]=v;pendD.add(k);}});
    S=migrate(o.state);S.live=null;persist();render();toast("Données importées");}catch(e){toast("Fichier non reconnu : choisis un export JSON de Mon Fitness");}};r.readAsText(f);}
};
let softT=null,softK=new Set();function soft(k){if(k)softK.add(k);clearTimeout(softT);softT=setTimeout(()=>{const ks=[...softK];softK.clear();if(ks.length)ks.forEach(x=>persist(x));else persist();},450);}
const ON_CHANGE=["import","exSel","day"];
document.addEventListener("click",e=>{const a=e.target.closest("[data-a]");if(!a)return;const f=ACT[a.dataset.a];if(f){e.preventDefault();f(a.dataset,a,e);}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.in&&!ON_CHANGE.includes(t.dataset.in))INP[t.dataset.in]?.(t);});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="photoIn"){onPhoto(t.files&&t.files[0]);return;}if(t.dataset&&ON_CHANGE.includes(t.dataset.in))INP[t.dataset.in](t);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#lightbox").hidden)ACT.closeLB();else if(!$("#sheet").hidden)closeSheet();}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.live&&!$("#live").hidden){wakeLock();drawTimer();}});

/* =====================================================================
   DÉMARRAGE
   ===================================================================== */
(function boot(){
  const bm=$("#brandMark");if(bm)bm.innerHTML=logoSVG(false,"hd");
  lsOK=lsTest();const loc=lsRead();
  if(loc&&loc.state){S=migrate(loc.state);SESSIONS=Array.isArray(loc.sessions)?loc.sessions:[];DAYS=loc.days&&typeof loc.days==="object"?loc.days:{};}
  setSync(lsOK?"loc":"none");render();if(S.live)renderLive();connectRuntime();
  if(STANDALONE){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}lphInit();}
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").then(r=>{r.update&&r.update().catch(()=>{});}).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded||(typeof S!=="undefined"&&S.live))return;reloaded=true;location.reload();});});}
</script>
